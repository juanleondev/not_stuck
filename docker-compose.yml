# Run one isolated stack per feature: COMPOSE_PROJECT_NAME=feat-x WEB_PORT=4401 API_PORT=8801 INSPECTOR_PORT=9301 docker compose up
# Ports are read from the shell or .env; the same number is used inside and outside the container.
x-app: &app
  build: .
  environment:
    HOST: 0.0.0.0
    WEB_PORT: ${WEB_PORT:-4321}
    API_PORT: ${API_PORT:-8787}
    INSPECTOR_PORT: ${INSPECTOR_PORT:-9229}

services:
  api:
    <<: *app
    working_dir: /app/server/api
    command: sh -c "[ -f .dev.vars ] || cp .dev.vars.example .dev.vars; npm run dev"
    ports:
      - "127.0.0.1:${API_PORT:-8787}:${API_PORT:-8787}"
    volumes:
      - ./server/api/src:/app/server/api/src
      - api-state:/app/server/api/.wrangler
  web:
    <<: *app
    working_dir: /app/apps/web
    command: npm run dev
    environment:
      HOST: 0.0.0.0
      WEB_PORT: ${WEB_PORT:-4321}
      API_URL: http://api:${API_PORT:-8787}
    ports:
      - "127.0.0.1:${WEB_PORT:-4321}:${WEB_PORT:-4321}"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
    depends_on:
      - api

volumes:
  api-state:
